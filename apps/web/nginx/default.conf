# CIMS NextMCC front end container.
#
# ROUTING CONTRACT WITH THE GATEWAY
# The SPA is served at the SITE ROOT of the shared hostname, never under a sub-path such as /app/
# (Vite base is "/", the router has no basename). The gateway (Nginx, configured in the API repository)
# sends this container ONLY:
#   1. the legacy page paths that have been flipped to the new front end, for example
#      /Home/Index and /Data/ConfirmArrival (the routes here mirror the legacy controller/action URLs),
#   2. /assets/ (hashed build output),
#   3. the small set of root files the SPA needs: /auth/callback (OIDC redirect and silent renew),
#      /login, /favicon.svg and /index.html.
# Everything else (not-yet-flipped pages, /api/, /identity/) goes to the legacy IIS site, the API or
# Identity at the gateway. Flipping a page is a gateway routing change plus a route in apps/web.
#
# WHAT THIS CONTAINER GUARANTEES
#   * /assets/ is served with a one-year immutable cache. A missing asset is a real 404, never index.html,
#     so a browser holding an old index.html cannot mistake a removed chunk for a page.
#   * Any other path falls back to index.html, so a deep link or a refresh on /Data/ConfirmArrival loads
#     the SPA and the client router renders the page. Unknown paths reach the SPA's NotFound page.
#   * index.html is never cached, so a new deployment is picked up on the next load.
#
# Run on its own (without the gateway) this container still works: the /api/ block below is a placeholder.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SAMEORIGIN, not DENY: oidc-client-ts renews tokens in a hidden same-origin iframe.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # PLACEHOLDER. In the target setup the gateway owns /api/ and /identity/ and routes them to the
    # API and Identity containers (modernization plan, section 2.2). This block only lets this container
    # run on its own. Replace the upstream, or delete the block when the gateway is in front.
    # The variable plus resolver delays name resolution to request time, so nginx still starts when the
    # API container does not exist yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://cims-nextmcc-api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # The entry point must always be revalidated so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # SPA fallback: any other path is a client-side route (/Home/Index, /Data/ConfirmArrival, /auth/callback).
    # The fallback response is index.html, so it must not be cached either.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
