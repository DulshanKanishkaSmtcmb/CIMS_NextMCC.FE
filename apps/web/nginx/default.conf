server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SAMEORIGIN, not DENY: oidc-client-ts renews tokens in a hidden same-origin iframe.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # PLACEHOLDER. In the target setup the Nginx gateway owns /api/ and /identity/ and routes them to the
    # API and Identity containers (modernization plan, section 2.2). This block only lets this container
    # run on its own. Replace the upstream, or delete the block when the gateway is in front.
    # The variable plus resolver delays name resolution to request time, so nginx still starts when the
    # API container does not exist yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://cims-nextmcc-api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The entry point must always be revalidated so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any other path is a client-side route (/Home/Index, /Data/ConfirmArrival, /auth/callback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
